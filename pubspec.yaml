name: gitalong
description: "GitAlong - Find the developer your project is missing. Intent-based collaboration matching backed by real GitHub work."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.2
  injectable: ^2.5.0

  # Navigation
  go_router: ^16.2.0

  # Responsive Design
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2

  # UI Components
  cached_network_image: ^3.4.1

  # Networking
  http: ^1.5.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Backend
  supabase_flutter: ^2.8.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # Utilities
  logger: ^2.6.1
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.2

  # Fonts & Icons
  google_fonts: ^6.3.0
  phosphor_flutter: ^2.1.0

  # Environment
  flutter_dotenv: ^6.0.0
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.5.4
  injectable_generator: ^2.6.2

  # Testing
  mockito: ^5.4.6
  bloc_test: ^9.1.7
  integration_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.2

  # App Icons & Splash
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/app_icon/
    - assets/illustrations/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon/app_icon.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon/app_icon.jpg"
    background_color: "#0A0A0A"
    theme_color: "#00E676"
  windows:
    generate: true
    image_path: "assets/app_icon/app_icon.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/app_icon/app_icon.jpg"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash.png
  android_12:
    image: assets/images/splash.png
    color: "#ffffff"
